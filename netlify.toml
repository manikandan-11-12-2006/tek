[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Forward /api/* requests to Netlify Serverless Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# React Router SPA Single Page Redirect (prevents 404 on page reload)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
